const SND={};let unlocked=false,muted=false;
try{muted=localStorage.getItem('m62mute')==='1'}catch(e){}
function initAudio(){if(unlocked)return;unlocked=true;
 for(const k in AUD){const a=new Audio(AUD[k]);a.preload='auto';SND[k]=a;
  if(k==='musiqa'||k==='vals'){a.loop=true;a.volume=0.35;continue;}
  if(k==='boshlash')continue;
  a.muted=true;try{const pr=a.play();if(pr)pr.then(()=>{if(!a._used){a.pause();a.currentTime=0;}a.muted=false;}).catch(()=>{a.muted=false;});}catch(e){a.muted=false;}}}
function play(name,vol=1){if(muted||!SND[name])return;const a=SND[name];a._used=true;try{a.muted=false;a.pause();a.currentTime=0;a.volume=vol;const pr=a.play();if(pr)pr.catch(()=>{});}catch(e){}}
let track=null;const wantTrack=()=>floors&&floors.length>=100?'musiqa':'vals';
function startMusic(){if(muted)return;const w=wantTrack();if(track&&track!==w&&SND[track])SND[track].pause();track=w;if(!SND[w])return;try{const pr=SND[w].play();if(pr)pr.catch(()=>{});}catch(e){}}
function stopMusic(){['musiqa','vals'].forEach(k=>{if(SND[k])SND[k].pause();});}
function toggleMute(){muted=!muted;try{localStorage.setItem('m62mute',muted?'1':'0')}catch(e){}if(muted)stopMusic();else if(state==='play')startMusic();}
let bubble=null,momT=0,praise=0;
function say(txt,snd){bubble={txt,l:1.8};momT=0.8;play(snd,1);}

function sprite(m,x,y,p,ov){for(let j=0;j<m.length;j++){const row=m[j];for(let i=0;i<row.length;i++){const col=(ov&&ov[row[i]])||PAL[row[i]];if(col)r(col,x+i*p,y+j*p,p,p);}}}

let suited=false,suitT=0,cradleP=0,planes=[],planeT=0;
let state='start',floors,cam,camT,lives,score,combo,best=0,t=0,ang=0,hanging,falling,debris,popups,jumpT,swayPhase,nextT,shake;
try{best=+localStorage.getItem('m62best')||0}catch(e){}
function reset(){suited=false;suitT=0;cradleP=0;planes=[];planeT=0;floors=[];cam=0;camT=0;lives=3;score=0;combo=0;hanging=true;falling=null;debris=[];popups=[];jumpT=0;swayPhase=0;nextT=0;shake=0;}
reset();
const n=()=>floors.length;
function swayAmp(){if(!n())return 0;let c=0;floors.forEach(f=>c+=f.x+BW/2-180);c/=n();return Math.min(46,Math.abs(c)*0.7+n()*0.35);}
function centroid(){let c=0;floors.forEach(f=>c+=f.x+BW/2-180);return n()?c/n():0;}
function disp(i){return swayAmp()*Math.sin(swayPhase)*Math.pow((i+1)/Math.max(n(),1),1.3)*Math.min(1,n()/6);}
const sy=wy=>GROUND-(wy-cam);

function drop(){
 if(state==='start'||state==='over'){reset();state='play';play('boshlash',0.8);startMusic();return;}
 if(!hanging||falling)return;
 const bx=PX+Math.sin(ang)*ROPE-BW/2, byTop=PY+Math.cos(ang)*ROPE;
 falling={x:bx,wy:GROUND-(byTop+BH)+cam,vy:0,vx:Math.cos(ang)*angVel()*ROPE*0.25};
 hanging=false;
}
function angVel(){const A=amp(),w=speed();return A*w*Math.cos(t*w);}
const amp=()=>0.42+Math.min(n()*0.018,0.38);
const speed=()=>2.1+Math.min(n()*0.04,1.6);

function land(){
 const k=n(),topX=k?floors[k-1].x+disp(k-1):BASEX,dx=falling.x-topX;
 if(Math.abs(dx)<BW*0.72){
  let perfect=Math.abs(dx)<9,x=perfect?topX:falling.x;
  floors.push({x:x-(k?disp(k):0),win:(k*7)%3});
  play('tushish',0.9);
  if(perfect){combo++;score+=20+combo*10;popups.push({txt:combo>1?'Zo\'r! x'+combo:'Zo\'r!',x:180,y:sy(k*BH+BH)-16,l:1});jumpT=0.6;play('zor',0.7);
   if(combo%2===0)say('Ana syurpriz-u, mana syurpriz!','ona_syurpriz');
   else say('Shakarsan, shakar!','ona_shakar');
   floors.forEach(f=>f.x+= (180-BW/2-f.x)*0.15);}
  else{combo=0;score+=10;}
  shake=perfect?0:3;
  if(n()===200&&!suited&&suitT<=0){suitT=1;popups.push({txt:'Koinotga xush kelibsiz!',x:180,y:200,l:1.6});}
  if(n()===100)popups.push({txt:'100 qavat! Tun tushdi',x:180,y:200,l:1.6});
  if(Math.abs(centroid())>BW*0.42){collapse();}
 }else{
  debris.push({x:falling.x,y:sy(falling.wy+BH),vx:dx>0?2:-2,vy:0,a:0,va:dx>0?0.08:-0.08});
  lives--;combo=0;shake=6;play('xato',0.8);
  popups.push({txt:'Tushib ketdi!',x:180,y:sy(k*BH)-30,l:1});
  if(lives<=0)over();
 }
 falling=null;nextT=0.45;
}
function collapse(){floors.slice(-4).forEach((f,i)=>debris.push({x:f.x,y:sy((n()-4+i)*BH+BH),vx:(Math.random()-0.5)*4,vy:-2,a:0,va:(Math.random()-0.5)*0.15}));floors.length=Math.max(0,n()-4);lives=0;over();}

 r('#6e5236',270,g0-46,6,46);r('#6e5236',342,g0-46,6,46);r('#9c4f3c',282,g0-64,50,10);r('#f2ead6',300,g0-72,10,8);r('#f2ead6',310,g0-70,4,4);
 r('#8a6a46',BASEX-8,g0-6,BW+16,6);
 r('#b59a70',0,g0,W,40);r('#a68b62',30,g0+12,16,4);r('#a68b62',250,g0+22,20,4);
 r('#8c7350',0,g0+40,W,6);r('#7d969a',0,g0+46,W,16);r('#a7bcbe',40,g0+52,24,3);r('#a7bcbe',220,g0+55,30,3);

function drawPlane(pl){const x=pl.x,y=pl.y,d=pl.d;g.save();if(d<0){g.translate(x*2+44,0);g.scale(-1,1);}
 r('#c9c2b2',x,y,44,8);r('#a8a090',x,y+6,44,2);r('#c9c2b2',x+40,y+2,6,4);r('#8f8778',x+2,y-8,8,8);r('#8f8778',x+16,y+4,14,10);r('#8f8778',x+18,y-4,10,4);
 for(let i=0;i<5;i++)r('#e8d9a8',x+14+i*5,y+2,2,2);if(Math.floor(t*3)%2)r('#d27a5e',x+2,y-10,3,3);g.restore();}
function drawCradle(x,feet){const top=feet-78,lc=nightK()>0.5?'#9a8f7c':'#3a3026';
 g.strokeStyle=lc;g.lineWidth=2;g.beginPath();g.moveTo(x+4,48);g.lineTo(x+4,top);g.moveTo(x+40,48);g.lineTo(x+40,top);g.stroke();
 r('#5a4a38',x,top,44,4);r('#7a6e5a',x-2,feet,48,6);r('#5a4a38',x-2,feet+6,48,3);r('#7a6e5a',x-2,feet-20,4,20);r('#7a6e5a',x+42,feet-20,4,20);r('#7a6e5a',x-2,feet-20,48,3);}
function drawCabin(x,feet){r('#8f969c',x-2,feet-74,48,74);r('#6c7378',x-2,feet-74,48,4);r('#6c7378',x+20,feet-68,4,64);r('#a9d0e6',x+6,feet-62,10,12);r('#a9d0e6',x+28,feet-62,10,12);r('#e8d9a8',x+16,feet-30,3,4);}
const SUIT={C:'#d9d9d9',c:'#b5b5b5',W:'#f2f2f2',w:'#cfcfcf',B:'#e6e6e6',b:'#bdbdbd',Y:'#6f6f6f',R:'#e6e6e6',r:'#bdbdbd',A:'#f2f2f2',a:'#d27a5e',L:'#bdbdbd',H:'#2b241c'};
function helmet(x,y,rows){g.globalAlpha=0.35;r('#a9d0e6',x+4,y-4,30,rows*2+6);g.globalAlpha=1;const c='#8a8f94';r(c,x+2,y-6,34,2);r(c,x+2,y+rows*2+2,34,3);r(c,x+2,y-6,2,rows*2+10);r(c,x+34,y-6,2,rows*2+10);r('#fbf7ec',x+26,y-2,4,4);}
function drawCrane(){
 r('#3a3026',0,0,W,40);
 r('#5a4a38',0,40,W,8);for(let i=0;i<W;i+=16)r('#7a6e5a',i,42,8,4);
 const hx=PX+Math.sin(ang)*ROPE,hy=PY+Math.cos(ang)*ROPE;
 r('#3a3026',PX-10,40,20,10);
 if(hanging){g.strokeStyle='#3a3026';g.lineWidth=2;g.beginPath();g.moveTo(PX,PY);g.lineTo(hx,hy-6);g.stroke();
  r('#3a3026',hx-6,hy-8,12,8);drawFloor(hx-BW/2,hy,n(),(n()*7)%3);}
}
function hud(){
 g.font='bold 15px monospace';g.textBaseline='middle';g.fillStyle='#f2ead6';
 g.fillText('Qavat '+n(),10,20);g.fillText('Ochko '+score,110,20);
 for(let i=0;i<3;i++)r(i<lives?'#d27a5e':'#5a4a38',246+i*20,13,14,14);
 if(state==='play'){r('#5a4a38',318,6,36,28);r('#f2ead6',328,12,6,16);r('#f2ead6',338,12,6,16);}
}
function panel(lines,sub){
 r('rgba(30,25,20,0.78)',30,210,300,190);r('#f2ead6',30,210,300,4);r('#f2ead6',30,396,300,4);
 g.textAlign='center';g.fillStyle='#f2ead6';g.font='bold 24px monospace';g.fillText(lines[0],180,250);
 g.font='bold 15px monospace';for(let i=1;i<lines.length;i++)g.fillText(lines[i],180,250+i*30);
 if(Math.floor(t*2)%2===0){g.fillStyle='#e8d9a8';g.fillText(sub,180,375);}g.textAlign='left';
}

let last=performance.now();
function loop(now){
 const dt0=Math.min(0.033,(now-last)/1000);last=now;const dt=state==='pause'?0:dt0;t+=dt;
 ang=amp()*Math.sin(t*speed());
 swayPhase+=dt*(1.6+n()*0.02);
 if(suitT>0){suitT-=dt;if(suitT<=0){suitT=0;suited=true;}}
 if(n()>=100&&n()<200&&state!=='pause'){planeT+=dt;if(planeT>=15){planeT=0;const d=Math.random()<0.5?1:-1;planes.push({x:d>0?-60:400,y:90+Math.random()*170,d});}}
 planes.forEach(pl=>pl.x+=pl.d*110*dt);planes=planes.filter(pl=>pl.x>-80&&pl.x<440);
 if(state==='play'&&!muted&&track!==wantTrack())startMusic();
 if(state==='play'){
  if(falling){falling.vy+=900*dt;falling.wy-=falling.vy*dt;falling.x+=falling.vx*dt*60*0.0;
   if(falling.wy<=n()*BH){falling.wy=n()*BH;land();}}
  if(!hanging&&!falling&&state==='play'){nextT-=dt;if(nextT<=0)hanging=true;}
 }
 camT=Math.max(0,n()*BH-230);cam+=(camT-cam)*Math.min(1,dt*4);
 debris.forEach(d=>{d.vy+=0.5;d.x+=d.vx;d.y+=d.vy;d.a+=d.va;});debris=debris.filter(d=>d.y<H+80);
 popups.forEach(p=>{p.y-=dt*30;p.l-=dt*0.9;});popups=popups.filter(p=>p.l>0);
 jumpT=Math.max(0,jumpT-dt);shake=Math.max(0,shake-dt*20);

 g.save();if(shake)g.translate((Math.random()-0.5)*shake,0);
 drawBg();
 for(let i=0;i<n();i++){drawFloor(floors[i].x+disp(i),sy(i*BH+BH),i,floors[i].win);}
 if(falling)drawFloor(falling.x,sy(falling.wy+BH),n(),(n()*7)%3);
 debris.forEach(d=>{g.save();g.translate(d.x+BW/2,d.y+BH/2);g.rotate(d.a);g.translate(-BW/2,-BH/2);drawFloor(0,0,1,0);g.restore();});
 const ride=cam>110;cradleP=clamp(cradleP+(ride?dt:-dt*3)/1.5,0,1);
 const ease=1-Math.pow(1-cradleP,3),feet=cradleP>0?(H+90)+(498-(H+90))*ease:sy(0);
 if(cradleP>0){drawCradle(22,feet);drawCradle(294,feet);}
 const hj=jumpT>0?Math.sin((0.6-jumpT)/0.6*Math.PI)*16:Math.round(Math.sin(t*3))*1;
 const hyy=feet-60-hj,lab=nightK()>0.5?'#f2ead6':'#3a3026';
 const mj=momT>0?Math.abs(Math.sin(momT*8))*6:0,myy=feet-52-mj;
 if(suitT>0){drawCabin(22,feet);drawCabin(294,feet);}
 else{
 if(hyy<H){sprite(jumpT>0?HERO_UP:HERO,26,hyy,2,suited?SUIT:null);if(suited)helmet(26,hyy,12);g.font='bold 11px monospace';g.fillStyle=lab;g.fillText('Usta',34,hyy-12);}
 if(myy<H){sprite(momT>0?MOM_UP:MOM,298,myy,2,suited?SUIT:null);if(suited)helmet(298,myy,10);g.font='bold 11px monospace';g.fillStyle=lab;g.fillText('Ona',306,myy-12);}
 }
 if(bubble&&myy<H){g.font='bold 13px monospace';const tw=g.measureText(bubble.txt).width,bw=tw+16,bx=Math.max(6,Math.min(354-bw,330-bw/2)),byb=myy-50;
  r('#3a3026',bx-2,byb-2,bw+4,32);r('#fbf7ec',bx,byb,bw,28);r('#fbf7ec',bx+bw-34,byb+28,8,6);r('#3a3026',bx+bw-34,byb+34,8,2);
  g.fillStyle='#3a3026';g.textBaseline='middle';g.fillText(bubble.txt,bx+8,byb+14);}
 g.restore();
 if(bubble){bubble.l-=dt;if(bubble.l<=0)bubble=null;}momT=Math.max(0,momT-dt);
 drawCrane();hud();
 popups.forEach(p=>{g.globalAlpha=Math.max(0,p.l);g.textAlign='center';g.font='bold 18px monospace';g.fillStyle='#3a3026';g.fillText(p.txt,p.x+1,p.y+1);g.fillStyle='#fbf7ec';g.fillText(p.txt,p.x,p.y);g.textAlign='left';g.globalAlpha=1;});
 if(state==='start')panel(['Mahalla-62','Uyni baland qur!','Ekranga bos - blok tushadi','Eng yaxshi: '+best],'Boshlash uchun bos');
 if(state==='over')panel(['Qurilish tugadi','Qavat: '+n(),'Ochko: '+score,'Eng yaxshi: '+best],'Qayta boshlash uchun bos');
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
cv.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();const b=cv.getBoundingClientRect(),px=(e.clientX-b.left)*W/b.width,py=(e.clientY-b.top)*H/b.height;if(state==='play'&&px>310&&py<42){pauseGame();return;}drop();});
addEventListener('keydown',e=>{initAudio();if(e.code==='Escape'||e.code==='KeyP'){state==='pause'?resumeGame():(state==='play'&&pauseGame());return;}if(state==='pause')return;if(e.code==='KeyM'){toggleMute();return;}if(e.code==='Space'||e.code==='Enter'){e.preventDefault();drop();}});
const DONATE_URL='';
try{const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();if(tg.disableVerticalSwipes)tg.disableVerticalSwipes();if(tg.setHeaderColor)tg.setHeaderColor('#3a3026');if(tg.setBackgroundColor)tg.setBackgroundColor('#2a231b');}}catch(e){}
const pm=document.getElementById('pm'),bSnd=document.getElementById('bSnd'),bDon=document.getElementById('bDon'),donMsg=document.getElementById('donMsg');
if(DONATE_URL)bDon.href=DONATE_URL;
function sndLabel(){bSnd.textContent='Ovoz: '+(muted?"o'chirilgan":'yoqilgan');}
function pauseGame(){state='pause';stopMusic();sndLabel();donMsg.textContent='';pm.classList.add('on');}
function resumeGame(){pm.classList.remove('on');state='play';last=performance.now();startMusic();}
document.getElementById('bRes').onclick=resumeGame;
bSnd.onclick=()=>{toggleMute();if(muted)stopMusic();sndLabel();};
document.getElementById('bNew').onclick=()=>{pm.classList.remove('on');reset();state='play';stopMusic();track=null;startMusic();};
bDon.onclick=e=>{if(!DONATE_URL){e.preventDefault();donMsg.textContent="Havola tez orada qo'shiladi";}};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pauseGame();});
